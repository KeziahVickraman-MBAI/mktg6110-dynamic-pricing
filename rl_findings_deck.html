<script>
// ===== MODEL START =====
const M = (() => {
  const COST = 1.2, RESTOCK = 450, STOCKOUT_PEN = 0.5, A0 = 4.0, B = 0.9, COMP_EDGE = -0.2, WEEKEND_WTP = 0.8;
  const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const TRAFFIC = [110, 100, 105, 115, 140, 185, 165];
  const WEATHER = {
    sunny: { label: 'Sunny', icon: '☀️', traffic: 1.0, a: 0.0 },
    cloudy: { label: 'Cloudy', icon: '⛅', traffic: 0.95, a: 0.25 },
    rainy: { label: 'Rainy', icon: '🌧️', traffic: 0.8, a: 0.7 },
    cold: { label: 'Cold snap', icon: '🥶', traffic: 0.9, a: 1.0 },
  };
  const WKEYS = Object.keys(WEATHER);
  const EVENTS = ['Farmers’ market', 'Office fair', 'Concert nearby', 'University open day', 'Marathon'];
  const PRICES = []; for (let p = 1; p <= 10.0001; p += 0.5) PRICES.push(+p.toFixed(2));

  function rng(seed) { // mulberry32
    let t = seed >>> 0;
    return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r ^= r + Math.imul(r ^ r >>> 7, 61 | r); return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  }
  function gauss(r) { let u = 0, v = 0; while (!u) u = r(); v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

  // 21 days of exogenous conditions + demand noise (shared by every player of the same scenario)
  function scenario(seed, nDays = 21) {
    const r = rng(seed), days = [];
    for (let d = 0; d < nDays; d++) {
      const dow = d % 7, wr = r();
      const weather = wr < 0.45 ? 'sunny' : wr < 0.7 ? 'cloudy' : wr < 0.9 ? 'rainy' : 'cold';
      const ev = r() < (dow >= 4 ? 0.3 : 0.1);
      const comp = r() < 0.5;
      const cprice = comp ? Math.round((3 + r() * 2.5) * 4) / 4 : null;
      days.push({ d, dow, weather, event: ev ? EVENTS[Math.floor(r() * EVENTS.length)] : null, comp, cprice, noise: Math.exp(0.1 * gauss(r) - 0.005) });
    }
    return days;
  }
  function traffic(day) { return TRAFFIC[day.dow] * WEATHER[day.weather].traffic * (day.event ? 1.5 : 1); }
  function utility(day) { return A0 + (day.dow >= 5 ? WEEKEND_WTP : 0) + WEATHER[day.weather].a + (day.event ? 1.2 : 0); }
  // probability a walk-in buys from us at price p
  function buyProb(day, p) {
    const u = Math.exp(utility(day) - B * p);
    const c = day.comp ? Math.exp(utility(day) - COMP_EDGE - B * day.cprice) : 0;
    return u / (1 + u + c);
  }
  function expDemand(day, p) { return traffic(day) * buyProb(day, p); }
  // ML-style suggestion: forecast today's demand, maximise today's profit, ignore inventory & future
  function mlPrice(day) {
    let best = 1, bv = -1e9;
    for (let p = 1; p <= 10.0001; p += 0.05) { const v = (p - COST) * expDemand(day, p); if (v > bv) { bv = v; best = p; } }
    return Math.round(best * 4) / 4;
  }

  function newShop() { return { inv: RESTOCK, t: 0, total: 0, log: [] }; }
  // advance one day; returns record
  function step(shop, day, p) {
    if (day.dow === 0 && shop.t > 0) shop.inv = RESTOCK;
    const invStart = shop.inv;
    const walkins = Math.round(traffic(day) * day.noise);
    const demand = Math.round(expDemand(day, p) * day.noise);
    const sold = Math.min(demand, shop.inv);
    const lost = demand - sold;
    shop.inv -= sold;
    const revenue = p * sold, cogs = COST * sold, stockPen = STOCKOUT_PEN * lost;
    const waste = day.dow === 6 ? COST * shop.inv : 0;
    const reward = revenue - cogs - stockPen - waste;
    shop.total += reward; shop.t++;
    const rec = { d: day.d, price: p, invStart, walkins, demand, sold, lost, revenue, cogs, stockPen, waste, reward, cum: shop.total, invEnd: shop.inv };
    shop.log.push(rec);
    return rec;
  }

  // ---- RL state encoding ----
  const DEM = ['Low', 'Normal', 'High'], COMP = ['None', 'Cheaper', 'Pricier'], INV = ['Tight', 'OK', 'Plenty'];
  function demandLevel(day) { const x = traffic(day) * Math.exp(utility(day) - A0); return x < 140 ? 0 : x < 500 ? 1 : 2; }
  function compLevel(day) { return !day.comp ? 0 : day.cprice < 4 ? 1 : 2; }
  function invLevel(inv, day) {
    // compare stock left with the share of this week's traffic still to come ("on pace" = 1)
    let left = 0, all = 0; for (let k = 0; k < 7; k++) { all += TRAFFIC[k]; if (k >= day.dow) left += TRAFFIC[k]; }
    const r = inv / (RESTOCK * left / all); return r < 0.85 ? 0 : r < 1.05 ? 1 : 2;
  }
  function stateOf(shop, day) {
    const inv = (day.dow === 0 && shop.t > 0) ? RESTOCK : shop.inv;
    return demandLevel(day) * 9 + compLevel(day) * 3 + invLevel(inv, day);
  }
  function stateName(s) { return { dem: DEM[Math.floor(s / 9)], comp: COMP[Math.floor(s / 3) % 3], inv: INV[s % 3] }; }
  const NS = 27, NA = PRICES.length;

  function newAgent() { return { Q: Array.from({ length: NS }, () => new Float64Array(NA)), N: Array.from({ length: NS }, () => new Uint32Array(NA)), episodes: 0 }; }
  function greedy(agent, s) { const q = agent.Q[s]; let b = 0; for (let a = 1; a < NA; a++) if (q[a] > q[b]) b = a; return b; }
  function choose(agent, s, eps, r) { const roll = r(); if (roll < eps) return { a: Math.floor(r() * NA), explore: true, roll }; return { a: greedy(agent, s), explore: false, roll }; }

  // one Q-learning transition; returns details for the step explainer
  function qStep(agent, ctx, hp, r) {
    const { shop, days } = ctx, day = days[shop.t];
    const s = stateOf(shop, day);
    const { a, explore, roll } = choose(agent, s, hp.eps, r);
    const rec = step(shop, day, PRICES[a]);
    const done = shop.t >= days.length;
    const s2 = done ? null : stateOf(shop, days[shop.t]);
    const maxNext = done ? 0 : Math.max(...agent.Q[s2]);
    const old = agent.Q[s][a];
    const target = rec.reward + (done ? 0 : hp.gamma * maxNext);
    agent.Q[s][a] = old + hp.alpha * (target - old);
    agent.N[s][a]++;
    return { s, a, explore, roll, eps: hp.eps, rec, s2, maxNext, old, target, nw: agent.Q[s][a], done, day };
  }
  function runEpisode(agent, seed, hp, r) {
    const ctx = { shop: newShop(), days: scenario(seed) };
    while (ctx.shop.t < ctx.days.length) qStep(agent, ctx, hp, r);
    agent.episodes++;
    return ctx.shop.total;
  }
  // policy evaluation (no learning) on a scenario
  function playPolicy(days, pick) {
    const shop = newShop();
    for (const day of days) step(shop, day, pick(shop, day));
    return shop;
  }
  const policies = {
    rl: agent => (shop, day) => PRICES[greedy(agent, stateOf(shop, day))],
    ml: () => (shop, day) => mlPrice(day),
    fixed: p => () => p,
  };
  function train(agent, n, hp, seedBase, r, onEp) {
    for (let i = 0; i < n; i++) {
      const tot = runEpisode(agent, seedBase + agent.episodes * 7919, hp, r);
      if (onEp) onEp(tot, agent.episodes);
      hp.eps = Math.max(hp.epsMin, hp.eps * hp.decay);
    }
  }

  // perfect-hindsight planner: knows every day's demand in advance, solves each week by dynamic programming
  function oracle(days) {
    const prices = []; for (let p = 1; p <= 10.0001; p += 0.25) prices.push(p);
    const plan = [];
    for (let w = 0; w < days.length / 7; w++) {
      const wk = days.slice(w * 7, w * 7 + 7), V = [], pick = [];
      V[7] = Float64Array.from({ length: RESTOCK + 1 }, (_, i) => -COST * i);
      for (let k = 6; k >= 0; k--) {
        const day = wk[k], opts = prices.map(p => [p, Math.round(expDemand(day, p) * day.noise)]);
        V[k] = new Float64Array(RESTOCK + 1).fill(-1e9); pick[k] = new Float64Array(RESTOCK + 1);
        for (let i = 0; i <= RESTOCK; i++) for (const [p, d] of opts) {
          const sold = Math.min(d, i), v = (p - COST) * sold - STOCKOUT_PEN * (d - sold) + V[k + 1][i - sold];
          if (v > V[k][i]) { V[k][i] = v; pick[k][i] = p; }
        }
      }
      let inv = RESTOCK;
      for (let k = 0; k < 7; k++) { const p = pick[k][inv]; plan.push(p); inv -= Math.min(inv, Math.round(expDemand(wk[k], p) * wk[k].noise)); }
    }
    return playPolicy(days, (shop) => plan[shop.t]);
  }

  return { oracle, COST, RESTOCK, STOCKOUT_PEN, DAYS, TRAFFIC, WEATHER, WKEYS, PRICES, DEM, COMP, INV, NS, NA, rng, scenario, traffic, utility, buyProb, expDemand, mlPrice, newShop, step, stateOf, stateName, newAgent, greedy, qStep, runEpisode, playPolicy, policies, train, demandLevel, compLevel, invLevel, A0, B, COMP_EDGE };
})();
// ===== MODEL END =====

</script>

// ============================== analysis of the journal ==============================
const weekend = d => d === 'Saturday' || d === 'Sunday';

const isEvent = t => /event/i.test(t || '') && !/no event/i.test(t || '');
const SITS = ['Weekday', 'Weekday + rival', 'Weekend', 'Event day'];
const sitOf = r => isEvent(r.traffic) ? 'Event day' : weekend(r.dow) ? 'Weekend' : present(r.comp) ? 'Weekday + rival' : 'Weekday';
function analyse(J) {
  const days = (J.days || []).filter(r => num(r.price) != null).sort((a, b) => (+a.n || 0) - (+b.n || 0)), N = days.length;
  let T = null;
  for (let i = 0; i < N; i++) { const rest = days.slice(i).filter(r => r.mode); if (days[i].mode === 'exploit' && rest.length >= 2 && rest.filter(r => r.mode === 'exploit').length / rest.length >= 0.7) { T = +days[i].n; break; } }
  const split = T ?? (N ? +days[Math.floor(N / 2)].n : 1);
  const before = days.filter(r => +r.n < split), after = days.filter(r => +r.n >= split);
  const pe = rs => rs.filter(r => num(r.expSold) != null && num(r.sold) != null).map(r => Math.abs(r.sold - r.expSold));
  const res = days.filter(r => num(r.sold) != null);
  const both = days.filter(r => num(r.reward) != null && num(r.rlReward) != null);
  const pol = J.policy || [];
  const polBefore = pol.filter(p => +p.since < split), polAfter = pol.filter(p => !p.retired);
  const sur = res.filter(r => num(r.expSold) > 0).map(r => ({ r, s: Math.abs(r.sold - r.expSold) / r.expSold + (r.surprise === 'very' ? .5 : r.surprise === 'somewhat' ? .2 : 0) })).sort((a, b) => b.s - a.s).map(x => x.r);
  const sitStats = rs => Object.fromEntries(SITS.map(s => { const m = rs.filter(r => sitOf(r) === s); return [s, { n: m.length, p: mean(m.map(r => +r.price)), cups: mean(m.filter(r => num(r.sold) != null).map(r => +r.sold)), rw: mean(m.filter(r => num(r.reward) != null).map(r => +r.reward)), rl: mean(m.filter(r => num(r.rlPrice) != null).map(r => +r.rlPrice)) }]; }));
  let trigger = '';
  if (T != null) {
    const rule = pol.filter(p => +p.since <= T && +p.since >= T - 3).sort((a, b) => b.since - a.since)[0];
    const s = res.filter(r => +r.n < T && +r.n >= T - 3 && (r.surprise === 'very' || r.surprise === 'somewhat')).pop();
    trigger = rule ? `Writing the rule “${rule.text}” on day ${rule.since}` : s ? `The surprise on day ${s.n}${s.learned ? ': “' + s.learned + '”' : ''}` : 'Seeing the same situations repeat';
  }
  const dayRef = p => { const m = /day\s*(\d+)/i.exec(p.why || ''); return m ? +m[1] : null; };
  const score = r => num(r.expSold) > 0 && num(r.sold) != null ? Math.abs(r.sold - r.expSold) / r.expSold + (r.surprise === 'very' ? .5 : 0) : -1;
  const adopted = T != null ? pol.filter(p => Math.abs(+p.since - T) <= 1) : [];
  let trig = null;
  if (T != null) {
    const refs = adopted.map(dayRef).filter(Boolean), pre = res.filter(r => +r.n < T);

    nExp: days.filter(r => r.mode === 'explore').length, expl, lo: pr.length ? Math.min(...pr) : null, hi: pr.length ? Math.max(...pr) : null, distinct: new Set(before.map(r => r.price)).size,
    rwB: mean(before.filter(r => num(r.reward) != null).map(r => +r.reward)), rwA: mean(after.filter(r => num(r.reward) != null).map(r => +r.reward)) };
}

// ============================== tiny chart kit ==============================
// every mark can carry data-tip; one delegated handler shows it
const tipAttr = h => `data-tip="${esc(h)}"`;
function wireTips(svg) {
  svg.onmousemove = ev => { const t = ev.target.closest('[data-tip]'); t ? showTip(t.dataset.tip, ev) : hideTip(); };
  svg.onmouseleave = hideTip;
}
const W = 800, H = 300;
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" font-size="${o.fs || 13}" fill="${o.fill || C.muted}" text-anchor="${o.a || 'start'}" font-weight="${o.fw || 400}"${o.mono ? ' font-family="ui-monospace,Menlo,monospace"' : ''}>${s}</text>`;
const niceTicks = (lo, hi, n = 4) => { const st = Math.pow(10, Math.floor(Math.log10((hi - lo) / n))), k = [1, 2, 2.5, 5, 10].map(f => f * st).find(s => (hi - lo) / s <= n + 1); const out = []; for (let v = Math.ceil(lo / k) * k; v <= hi + 1e-9; v += k) out.push(+v.toFixed(6)); return out; };
function yGrid(Y, ticks, l, r, fmt) { return ticks.map(v => `<line x1="${l}" x2="${r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef0f3"/>` + txt(l - 8, Y(v) + 4, fmt(v), { a: 'end', fs: 12 })).join(''); }
// a dashed horizontal reference line with a label at the right
const refLine = (Y, v, l, r, label, col) => `<line x1="${l}" x2="${r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-width="2" stroke-dasharray="6 4"/>` + txt(r + 6, Y(v) + 4, label, { fill: C.ink, fw: 600, fs: 12.5 });
// dots joined by a line over categories, with reference lines (no zero baseline needed for dots)
function dotLine(svg, { cats, vals, hl, refs, fmt, lo, hi, col = C.navy, tips, xTitle }) {
  const m = { l: 62, r: 150, t: 16, b: 46 }, cw = (W - m.l - m.r) / cats.length;
  const X = i => m.l + cw * (i + 0.5), Y = v => m.t + (H - m.t - m.b) * (1 - (v - lo) / (hi - lo));
  let s = yGrid(Y, niceTicks(lo, hi), m.l, W - m.r, fmt);
  refs.forEach(r => s += refLine(Y, r.v, m.l, W - m.r, r.label, r.col));
  s += `<polyline points="${vals.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="2"/>`;
  vals.forEach((v, i) => {
    const on = hl.includes(i);
    s += `<g ${tipAttr(tips[i])}><rect x="${X(i) - cw / 2}" y="${m.t}" width="${cw}" height="${H - m.t - m.b}" fill="transparent"/>`;
    s += `<circle cx="${X(i)}" cy="${Y(v)}" r="${on ? 9 : 6}" fill="${on ? C.amber : col}" stroke="#fff" stroke-width="2"/>`;
    const below = refs.some(r => Math.abs(Y(r.v) - (Y(v) - 18)) < 12); s += txt(X(i), below ? Y(v) + 24 : Y(v) - 14, fmt(v), { a: 'middle', fill: C.ink, fw: on ? 700 : 500, fs: 12.5, mono: 1 }) + '</g>';
    s += txt(X(i), H - m.b + 20, cats[i], { a: 'middle', fill: on ? C.ink : C.muted, fw: on ? 700 : 400 });
  });
  if (xTitle) s += txt(m.l + (W - m.l - m.r) / 2, H - 6, xTitle, { a: 'middle', fill: C.ink, fw: 600 });
  svg.innerHTML = s; wireTips(svg);
}

// step k shows point k and its chart; the last step adds the strip

function applyBuild(runAct = true) {
